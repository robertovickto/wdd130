<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> quiz </title>
    <link rel="stylesheet" href="styles/quiz.css">

</head>

<body>

    <header>

    </header>

    <main>

        <h1> Basic HTML and CSS Quiz </h1>


        <form>

            <div>

                <label for="q1"> <span> Q1. </span> What does the acronym "CSS" stand for? </label>

                <input type="text" id="q1" name="Question 1">

            </div>

            <div>

                <label for="q2"> <span> Q2. </span> How are id and class attributes selected in CSS? </label>

                <textarea type="textarea" id="q2" name="Question 2"></textarea>

            </div>

            <div>

                <label for="q3"> <span> Q3. </span> Which of the following is a valid CSS comment?</label>

                <select id="q3" name="Question 4">

                    <option disabled selected> Choose one ... </option>
                    <option value="A"> A. // This is a CSS comment // </option>
                    <option value="B"> B. /* This is a CSS comment */ </option>
                    <option value="C"> C. # This is a CSS comment # </option>

                </select>

            </div>

            <div>

                <label for="q4">

                    <span> Q4. </span> What is the bottom margin given this declaration?

                    <div class="example-code"> margin: 10px 5px 15px; </div>

                </label>

                <input type="number" id="q4" name="Question 4">

            </div>

            <div>

                <button type="submit"> Submit Quiz </button>

            </div>

        </form>

    </main>

</body>

</html>
