<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The contact page of the business website for WBR, a rafting company.">
    <meta name="author" content="Robert, Victor">
    <title> Contact Us | WATER BENDERS RAFTING </title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body class="contact-page">

    <header class="header-layout">

        <img class="header-img-layout" src="images/water-benders-logo.png" alt="WWR logo">

        <nav class="nav-layout">

            <a href="index.html"> Home </a>
            <a href="about.html"> About Us </a>
            <a href="trips.html"> Trips </a>
            <a href="contact.html"> Contact Us </a>

        </nav>

    </header>

    <main>

        <section class="section3">

            <h1> WATER BENDERS RAFTING </h1>

            <P> 14 Agbokim Falls Road </P>
            <p> Calabar, Cross River </p>
            <p> +234 807 900 8962 </p>
            <p> info@waterbendersrafting.com </p>

        </section>

        <section class="section4">

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m13!1m8!1m3!1d59936.20043213089!2d8.918154226405994!3d5.889053635365972!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNcKwNTQnMjUuMCJOIDjCsDU0JzQ2LjAiRQ!5e0!3m2!1sen!2sng!4v1790898533469!5m2!1sen!2sng"
                width="400" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>

        </section>

        <section class="section5">

            <form>

                <div class="style-form">

                    <label for="fullname"> Name: </label>

                    <input type="text" id="fullname" name="fullname">

                </div>

                <div class="style-form">

                    <label for="email"> Email: </label>

                    <input type="text" id="email" name="useremail">

                </div>

                <fieldset>

                    <legend> Message Purpose: </legend>

                    <label for="generalinquiry"> <input type="radio" id="generalinquiry" name="messagepurpose"> General
                        Inquiry </label>

                    <label for="reservation"> <input type="radio" id="reservation" name="messagepurpose"> Reservation
                        Questions </label>

                    <label for="suggestion"> <input type="radio" id="suggestion" name="messagepurpose"> Website
                        Suggestions </label>

                </fieldset>

                <div class="message">

                    <label for="message"> Message: </label>

                    <textarea id="message" name="usermessage"></textarea>

                </div>

                <div class="newsletter">

                    <label for="newsletter"> <input type="checkbox" id="newsletter" name="joinnewsletter"> Please
                        Subcribe me to the monthly newsletter. </label>

                </div>

                <div>

                    <button type="submit"> Get in Touch </button>

                </div>

            </form>

        </section>

        <section class="section6">

            <h2> We Are Here to Serve You </h2>

            <figure>

                <img src="images/profile.jpg" alt="Founder and CEO, Robert, Victor.">
                <figcaption> Robert, Victor </figcaption>

            </figure>


            <figure>

                <img src="images/employee-1.jpg" alt="CFO, Isaac Nwadukwe.">
                <figcaption> Isaac Nwadukwe </figcaption>

            </figure>


            <figure>

                <img src="images/employee-2.jpg" alt="COO, Adekunle Elvis Adefioye.">
                <figcaption> Adekunle Elvis Adefioye </figcaption>

            </figure>

        </section>

    </main>

    <footer class="footer-layout">

        <p> | &copy; 2026 | WATER BENDERS RAFTING | ROBERT, VICTOR | All rights reserved| </p>

        <nav class="socialmedia">

            <a href="https://facebook.com/" target="_blank"> <img src="images/facebook-logo.svg" alt="Facebook"> </a>

            <a href="https://whatsapp.com/" target="_blank"> <img src="images/whatsapp-logo.svg" alt="WhatsApp"> </a>

            <a href="https://instagram.com/" target="_blank"> <img src="images/instagram-logo.svg" alt="Instagram"> </a>

        </nav>

    </footer>

</body>

</html>
